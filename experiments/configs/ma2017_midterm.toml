# Small subset of ma2017_small.toml for the mid-term (Oct 20) preliminary
# results: 3 agent counts x 3 task frequencies x 3 seeds = 27 runs per method
# for M0, M1, M3, M4 and M5.
# Parameters are first guesses; proper tuning happens after the mid-term.

map = "maps/warehouse_small.map"
n_tasks = 500
agents = [10, 30, 50]
arrival_rates = [0.2, 1, 5]
seeds = [0, 1, 2]

[methods.tp]

[methods.highway]
w_h = 1.5
# One-way lanes; see maps/README.md
directions = "maps/warehouse_small.highway.json"

[methods.foresight]
lam = 1.0
window = 5

[methods.foresight_st]
lam = 1.0
delta = 2

[methods.foresight_std]
lam = 1.0
delta = 2
mu = 1.0
delta_dir = 2
