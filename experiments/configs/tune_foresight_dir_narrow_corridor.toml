# Tuning direction-only M5 (lam = 0) on narrow_corridor.map for the lane study
# (results/summary/lanes.md). Tuning seeds only; never report these runs.
# Same setting and selection rule as tune_foresight_narrow_corridor.toml.
#
#   python experiments/run.py experiments/configs/tune_foresight_dir_narrow_corridor.toml --out results/tune_foresight_dir_narrow_corridor.csv --jobs 10

map = "maps/narrow_corridor.map"
n_tasks = 500
agents = [30]
arrival_rates = [1, 5]
seeds = [100, 101, 102, 103, 104]

[methods.tp]

[methods.foresight_std]
lam = 0.0
delta = 2
mu = [0.5, 1.0, 2.0, 4.0]
delta_dir = 2
